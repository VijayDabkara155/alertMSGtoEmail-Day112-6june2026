apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: monitoring

data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:

    exporters:
      otlp:
        endpoint: tempo:4317
        tls:
          insecure: true

      prometheus:
        endpoint: "0.0.0.0:8889"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]

      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp]

        metrics:
          receivers: [otlp]
          exporters: [prometheus]
